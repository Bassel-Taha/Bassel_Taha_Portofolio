<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore a software engineering or BIM automation project by Bassel Taha.">
  <meta name="color-scheme" content="dark light">
  <title>Project Details | Bassel Taha</title>
  <script src="theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400..800&amp;family=JetBrains+Mono:wght@400..800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portfolio.css">
  <script defer src="projects_data.js"></script>
  <script defer src="project-details.js"></script>
  <script defer src="site-interactions.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header case-header">
    <div class="shell header-inner">
      <a class="wordmark" href="./"><span class="monogram" aria-hidden="true">BT</span><span>Bassel Taha</span></a>
      <div class="header-actions">
        <button class="icon-button quick-find" data-quick-find type="button" aria-label="Quick find" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K" hidden><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7 5 5-5 5m8 0h6"/></svg><span>Quick find</span><kbd></kbd></button>
        <button class="icon-button theme-button" data-theme-toggle type="button" aria-label="Light theme" aria-pressed="false" hidden>
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="case-main case-shell" tabindex="-1">
    <a href="./#projects" class="case-back">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4m6-6-6 6 6 6"/></svg>
      Back to projects
    </a>
    <article id="project-container" hidden>
      <header class="case-hero" data-spotlight>
        <div class="case-intro">
          <p class="eyebrow section-eyebrow" id="category"></p>
          <h1 id="title"></h1>
          <p class="case-role" id="role"></p>
          <ul class="tag-list" id="tags" aria-label="Technologies"></ul>
        </div>
        <figure class="case-visual" hidden>
          <figcaption>Project illustration</figcaption>
        </figure>
      </header>
      <div class="case-content" id="content">
        <section class="case-card case-overview" aria-labelledby="overview-title">
          <h2 id="overview-title">Project overview</h2>
          <p id="overview-text"></p>
        </section>
        <section class="case-card" id="case-workflow" aria-labelledby="workflow-title" hidden>
          <h2 id="workflow-title"></h2>
        </section>
        <section class="case-card" id="case-details" aria-labelledby="details-title">
          <div class="case-section-heading">
            <h2 id="details-title">Technical details</h2>
            <button class="button button-secondary case-detail-toggle" type="button" aria-controls="detail-panels" hidden>Expand all</button>
          </div>
          <div class="case-disclosures" id="detail-panels"></div>
        </section>
      </div>
      <nav class="case-next" aria-label="More projects" hidden>
        <a href="#"><span></span><span aria-hidden="true">↗</span></a>
      </nav>
    </article>
    <div class="case-hero case-missing" id="not-found" hidden>
      <h1>Project not found</h1>
      <p>The project link may be out of date. Browse the portfolio to find the case study.</p>
    </div>
    <noscript><p>Enable JavaScript to view the project details.</p></noscript>
  </main>

  <footer class="site-footer case-shell">
    <span>Built by <strong>Bassel Taha</strong></span>
    <a href="./#contact">Get in touch <span aria-hidden="true">↗</span></a>
  </footer>
</body>
</html>
