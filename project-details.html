<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Details — Bassel Taha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f7fb; --bg2: #edf0f7; --surface: rgba(255, 255, 255, 0.75); --surface2: rgba(255, 255, 255, 0.9);
      --glass: rgba(255, 255, 255, 0.7); --accent: #2563eb; --accent2: #0d9488; --accent3: #e11d48;
      --text1: #1e293b; --text2: #475569; --text3: #94a3b8; --border: rgba(37, 99, 235, 0.12);
      --border2: rgba(0, 0, 0, 0.06); --r: 16px; --r-lg: 24px; --ease: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.dark-mode {
      --bg: #0f172a; --bg2: #1e293b; --surface: rgba(15, 23, 42, 0.75); --surface2: rgba(30, 41, 59, 0.9);
      --glass: rgba(15, 23, 42, 0.75); --accent: #60a5fa; --accent2: #2dd4bf; --accent3: #fb7185;
      --text1: #f8fafc; --text2: #cbd5e1; --text3: #94a3b8; --border: rgba(255, 255, 255, 0.1);
      --border2: rgba(255, 255, 255, 0.05);
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text1); line-height: 1.6; }
    
    .nav {
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      color: var(--text2); text-decoration: none; font-weight: 600; font-size: 0.9rem;
      padding: 0.5rem 1rem; border-radius: 100px; border: 1px solid var(--border2);
      background: var(--surface2); transition: var(--ease);
    }
    .back-btn:hover { color: var(--accent); border-color: var(--accent); transform: translateX(-4px); }
    
    .container {
      max-width: 900px;
      margin: 2rem auto 6rem;
      padding: 0 2rem;
    }
    
    .project-header { margin-bottom: 3rem; }
    .project-title { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; line-height: 1.1; margin-bottom: 1rem; color: var(--text1); letter-spacing: -1px; }
    .project-role { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--accent2); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2rem; }
    
    .tags-container { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; }
    .p-tag {
      background: rgba(0, 0, 0, 0.03); color: var(--text3); padding: 0.3rem 0.8rem;
      border-radius: 6px; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace;
      border: 1px solid var(--border2);
    }
    body.dark-mode .p-tag { background: rgba(255,255,255,0.05); color: var(--text2); }
    
    .content-card {
      background: var(--glass);
      border: 1px solid var(--border2);
      border-radius: var(--r-lg);
      padding: 3rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.03);
      backdrop-filter: blur(16px);
      font-size: 1.05rem;
      color: var(--text2);
    }
    .content-card strong { color: var(--text1); font-weight: 700; }
    .content-card ul { margin-left: 1.5rem; margin-top: 1rem; margin-bottom: 1.5rem; }
    .content-card li { margin-bottom: 0.5rem; }

    /* error display */
    #not-found { display: none; text-align: center; margin-top: 10vh; }
  </style>
</head>
<body>
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }
  </script>

  <nav class="nav">
    <a href="index.html#projects" class="back-btn">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to Portfolio
    </a>
  </nav>

  <div class="container" id="project-container">
    <div class="project-header">
      <h1 class="project-title" id="title">Loading...</h1>
      <div class="project-role" id="role"></div>
      <div class="tags-container" id="tags"></div>
    </div>
    
    <div class="content-card" id="content">
      <!-- HTML content injected here -->
    </div>
  </div>

  <div class="container" id="not-found">
    <h1 style="font-size: 3rem; color: var(--text1);">Project Not Found</h1>
    <p style="margin-top: 1rem;">The project you are looking for does not exist or the link is invalid.</p>
  </div>

  <script src="projects_data.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      
      const project = typeof projectsData !== "undefined" ? projectsData[id] : null;

      if (!project) {
        document.getElementById("project-container").style.display = "none";
        document.getElementById("not-found").style.display = "block";
        return;
      }

      document.getElementById("title").textContent = project.title;
      document.getElementById("role").textContent = project.role;
      
      const tagsContainer = document.getElementById("tags");
      project.tags.forEach(tag => {
        const span = document.createElement("span");
        span.className = "p-tag";
        span.textContent = tag;
        tagsContainer.appendChild(span);
      });

      document.getElementById("content").innerHTML = project.fullHtml;
    });
  </script>
</body>
</html>
