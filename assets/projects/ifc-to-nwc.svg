<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">IFC to NWC Converter</title>
  <desc id="desc">An IFC file passes through an isometric building model and becomes an NWC file.</desc>

  <defs>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#141e34"/>
      <stop offset="1" stop-color="#080f1b"/>
    </linearGradient>
    <radialGradient id="mint-glow">
      <stop stop-color="#337c78" stop-opacity=".55"/>
      <stop offset="1" stop-color="#337c78" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-glow">
      <stop stop-color="#385389" stop-opacity=".65"/>
      <stop offset="1" stop-color="#385389" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow-color">
      <stop stop-color="#86b7ff"/>
      <stop offset="1" stop-color="#7bead0"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1" fill="#d4e5ff" opacity=".15"/>
    </pattern>
    <path id="file" d="M4 0h35l17 17v48a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4Zm35 0v17h17M12 33h32M12 45h24"/>
  </defs>

  <path fill="url(#background)" d="M0 0h960v480H0z"/>
  <ellipse fill="url(#mint-glow)" cx="670" cy="150" rx="470" ry="258"/>
  <ellipse fill="url(#blue-glow)" cx="190" cy="442" rx="410" ry="255"/>
  <path fill="url(#grid)" d="M0 0h960v480H0z"/>
  <path d="M44 69V43h26m820 394h26v-26" fill="none" stroke="#7bead0" stroke-opacity=".55" stroke-width="2"/>

  <rect x="76" y="88" width="808" height="326" rx="19" fill="#050b17" opacity=".42"/>
  <rect x="72" y="78" width="816" height="322" rx="18" fill="#101a2b" stroke="#405d78" stroke-width="2"/>
  <path d="M90 79h780a17 17 0 0 1 17 17v29H73V96a17 17 0 0 1 17-17Z" fill="#1d2d46"/>
  <g fill="#7bead0">
    <circle cx="98" cy="102" r="4"/>
    <circle cx="114" cy="102" r="4" opacity=".65"/>
    <circle cx="130" cy="102" r="4" opacity=".35"/>
  </g>
  <text x="151" y="108" fill="#d6e6f7" font-family="monospace" font-size="17" font-weight="700">Model conversion</text>

  <g fill="#172741" stroke-width="2">
    <rect x="115" y="172" width="174" height="174" rx="14" stroke="#5278a9"/>
    <rect x="671" y="172" width="174" height="174" rx="14" fill="#152e37" stroke="#4b918a"/>
  </g>

  <g fill="none" stroke="url(#arrow-color)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M301 250h66m-9-8 9 8-9 8m235-8h66m-9-8 9 8-9 8"/>
  </g>

  <g transform="translate(174 192)" fill="none" stroke="#91bcff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <use href="#file"/>
  </g>
  <g transform="translate(730 192)" fill="none" stroke="#7bead0" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <use href="#file"/>
  </g>
  <g font-family="system-ui, sans-serif" font-weight="750" font-size="32" text-anchor="middle">
    <text x="202" y="309" fill="#c1dbff">IFC</text>
    <text x="758" y="309" fill="#a6f0dc">NWC</text>
  </g>

  <g stroke="#79d6de" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <path d="m480 165 87 43-87 43-87-43z" fill="#286276" fill-opacity=".54"/>
    <path d="m393 208 87 43v80l-87-43z" fill="#2a4669" fill-opacity=".74"/>
    <path d="m480 251 87-43v80l-87 43z" fill="#15505a" fill-opacity=".75"/>
    <path d="m422 194 87 43m-58-57 87 43m-116 0 87-43m-58 57 87-43m-145 40 87 43 87-43m-174 27 87 43 87-43m-145-38v79m29-65v79m58-79v79m29-93v79" fill="none" stroke-opacity=".61"/>
    <path d="m509 263 29-14v26l-29 14z" fill="#7bead0" fill-opacity=".46" stroke="#a9ffe8"/>
  </g>
</svg>
